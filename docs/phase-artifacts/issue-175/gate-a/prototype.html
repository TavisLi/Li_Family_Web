document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;popupOrigin={kind:'item',key:selected};render('item:'+selected);announce('已選取 '+items.find(x=>x.id===selected).name)});document.querySelectorAll('[data-marker]').forEach(b=>b.onclick=()=>{let g=grouped.find(x=>x.place===b.dataset.marker);popupOrigin={kind:'marker',key:g.place};if(g.items.length>1){selected=null;selectedGroup=g.place}else{selectedGroup=null;selected=g.items[0].id}render('marker:'+g.place);announce(g.items.length>1?'同一地點有 '+g.items.length+' 趟旅程': '已選取 '+g.items[0].name)});document.querySelectorAll('[data-destination]').forEach(b=>b.onclick=()=>{chapter=b.dataset.destination;selected=null;selectedGroup=null;render('day:'+chapter);announce('已前往 '+chapter+' 的故事')});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{if(page==='plan')day=b.dataset.day;else chapter=b.dataset.day;selected=null;selectedGroup=null;render('day:'+b.dataset.day);announce('已切換 '+b.dataset.day)});if($('year'))$('year').onchange=e=>{year=e.target.value;selectedGroup=null;render('year');announce('符合條件 '+visible().length+' 趟旅程')};if($('status'))$('status').onchange=e=>{status=e.target.value;selectedGroup=null;render('status');announce('符合條件 '+visible().length+' 趟旅程')};if($('clear'))$('clear').onclick=()=>{year='全部年份';status='全部狀態';render('year');announce('已清除篩選')};const reset=document.querySelector('[data-clear-group]');if(reset)reset.onclick=()=>{selectedGroup=null;render();document.querySelector('[data-marker]')?.focus()};let close=popup.querySelector('.close');if(close)close.onclick=()=>{let origin=popupOrigin;selected=null;selectedGroup=null;render(origin?origin.kind+':'+origin.key:null);announce('已關閉詳情')};
if(focusKey){const [kind,...rest]=focusKey.split(':'),key=rest.join(':');let target=kind==='item'?document.querySelector('[data-item="'+CSS.escape(key)+'"]'):kind==='marker'?document.querySelector('[data-marker="'+CSS.escape(key)+'"]'):kind==='day'?document.querySelector('[data-day="'+CSS.escape(key)+'"]'):kind.startsWith('zoom-')?document.querySelector('[data-zoom="'+CSS.escape(kind.slice(5))+'"]'):$(kind);target?.focus({preventScroll:true})}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;selected=null;selectedGroup=null;mapState='一般';zoom=1;render();announce('已切換 '+b.textContent)});$('map-state').onchange=e=>{mapState=e.target.value;selectedGroup=null;render('map-state');announce('地圖狀態：'+mapState)};document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{zoom=b.dataset.zoom==='in'?Math.min(zoom*1.4,4):b.dataset.zoom==='out'?Math.max(zoom/1.4,1):1;const key='zoom-'+b.dataset.zoom;render(key);announce(b.dataset.zoom==='reset'?'已重設地圖':'地圖縮放 '+Math.round(zoom*100)+'%')});render();

</script></body></html>
