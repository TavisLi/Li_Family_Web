name: CodeQL
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'patches/**'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL / JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
      - name: Compact analysis summary
        if: always()
        run: echo "Tested head ${{ github.event.pull_request.head.sha }}; CodeQL ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
